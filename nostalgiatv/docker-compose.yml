networks:
  backend:
    external: true

services:
  nostalgiatv:
    image: purestream711/nostalgiatv-server:latest
    container_name: nostalgiatv-server
    networks:
      - backend
    volumes:
      - /opt/nostalgiatv/data:/app/data
      - /opt/nostalgiatv/config:/app/config
      - /opt/nostalgiatv/logos:/app/logos
    environment:
      - TZ=America/New_York
      # Run as your host user so the bind-mounted folders above stay writable
      # (find yours with `id -u` / `id -g`). See "Volumes & permissions" below.
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "io.traefik.instance=private"
      - "traefik.http.routers.nostalgiatv-secure.entrypoints=https"
      - "traefik.http.routers.nostalgiatv-secure.rule=Host(`tv.big-melpert.ratsnest.dev`)"
      - "traefik.http.routers.nostalgiatv-secure.tls=true"
      - "traefik.http.services.nostalgiatv-secure.loadbalancer.server.port=19850"
      - "traefik.http.services.nostalgiatv-secure.loadbalancer.server.scheme=http"
