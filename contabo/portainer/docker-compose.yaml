volumes:
    portainer_data:

networks:
    backend:
        external: true

services:
    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer
        security_opt:
            - no-new-privileges:true
        networks:
            - backend
        #ports:
        #    - 8000:8000
        #    - 9443:9443
        environment:
            - VIRTUAL_HOST=portainer.contabo.ratsnest.dev
            - VIRTUAL_PORT=9000
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data
        restart: always
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=backend"
            - "io.traefik.instance=internal"
            - "traefik.http.routers.portainer.entrypoints=http"
            - "traefik.http.routers.portainer.rule=Host(`portainer.contabo.ratsnest.dev`)"
            - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https"
            - "traefik.http.routers.portainer.middlewares=portainer-https-redirect"
            - "traefik.http.routers.portainer-secure.entrypoints=https"
            - "traefik.http.routers.portainer-secure.rule=Host(`portainer.contabo.ratsnest.dev`)"
            #- "traefik.http.routers.portainer-secure.middlewares=ip-whitelist@file"
            - "traefik.http.routers.portainer-secure.tls=true"
            - "traefik.http.routers.portainer-secure.service=portainer"
            - "traefik.http.services.portainer.loadbalancer.server.port=9443"
            - "traefik.http.services.portainer.loadbalancer.server.scheme=https"
